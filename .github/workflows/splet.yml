name: Prenos prosto licenciranih slik (Wikimedia Commons)
on:
  push:
    branches: [splet]
    paths: ['web/chosen.json', 'web/fetch_big.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 web/fetch_big.py
      - run: |
          git config user.name "splet-bot"
          git config user.email "splet-bot@users.noreply.github.com"
          git add web
          git commit -m "Slike z Wikimedia Commons" || echo "nic novega"
          git push
